<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NuCel CX Dashboard</title>
<style>
:root{--p:#820AD1;--dk:#1A0033;--lt:#F5F0FA;--bg:#F8F9FA;--card:#FFF;--bd:#E8E8E8;--tx:#1A1A1A;--mu:#777;--gn:#00B89A;--yw:#F5A623;--rd:#D0021B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;}
header{background:var(--dk);color:#fff;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
header h1{font-size:18px;font-weight:700;}header p{font-size:11px;opacity:.55;margin-top:3px;}
.hr{display:flex;align-items:center;gap:10px;}
.badge{background:var(--p);color:#fff;font-size:11px;padding:4px 12px;border-radius:20px;font-weight:600;}
.stog{display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;}
.sb{background:none;border:none;color:rgba(255,255,255,.55);padding:5px 13px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;}
.sb.on{background:var(--p);color:#fff;}
.subnav{background:#fff;border-bottom:2px solid var(--bd);padding:0 32px;display:flex;overflow-x:auto;}
.snb{background:none;border:none;padding:14px 20px;font-size:13px;cursor:pointer;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;margin-bottom:-2px;}
.snb.on{color:var(--p);border-bottom-color:var(--p);font-weight:700;}
.innav{background:#fafafa;border-bottom:1px solid var(--bd);padding:0 32px;display:flex;}
.inb{background:none;border:none;padding:10px 16px;font-size:13px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
.inb.on{color:var(--p);border-bottom-color:var(--p);font-weight:600;}
.pg{display:none;padding:24px 32px;}.pg.on{display:block;}
.ip{display:none;}.ip.on{display:block;}
.kr{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kc{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--bd);}
.kv{font-size:26px;font-weight:800;color:var(--p);line-height:1;}.kl{font-size:11px;color:var(--mu);margin-top:5px;}.kt{font-size:10px;color:var(--mu);margin-top:3px;}
.card{background:var(--card);border-radius:12px;border:1px solid var(--bd);padding:20px;margin-bottom:16px;}
.card h3{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
.card h2{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:16px;}
.ibox{background:linear-gradient(135deg,#1A0033,#3D0070);border-radius:12px;padding:22px;color:#fff;margin-bottom:16px;}
.ibox-t{font-size:11px;font-weight:700;opacity:.65;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.ibox-big{font-size:48px;font-weight:800;line-height:1;margin:8px 0;}
.ibox-p{font-size:12px;opacity:.6;margin-top:6px;line-height:1.6;}
.ibox h3{font-size:11px;font-weight:700;opacity:.65;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.ibox .big{font-size:40px;font-weight:800;line-height:1;}.ibox p{font-size:12px;opacity:.6;margin-top:5px;line-height:1.5;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.mk4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.mk{background:var(--bg);border-radius:8px;padding:12px;text-align:center;}
.mkv{font-size:20px;font-weight:700;}.mkl{font-size:10px;color:var(--mu);margin-top:3px;}
.trc{background:var(--card);border-radius:8px;border:1px solid var(--bd);margin-bottom:8px;overflow:hidden;}
.trh{padding:10px 14px;background:#fafafa;display:flex;justify-content:space-between;cursor:pointer;align-items:center;gap:8px;}
.trh:hover{background:var(--lt);}
.trb{padding:13px 14px;display:none;border-top:1px solid var(--bd);font-size:12px;color:#444;line-height:1.7;}
.trb.on{display:block;}
.cg{display:grid;grid-template-columns:220px 1fr;gap:16px;}
.cl{display:flex;flex-direction:column;gap:4px;max-height:600px;overflow-y:auto;}
.ci{padding:10px 12px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.ci:hover,.ci.on{background:var(--lt);border-color:var(--p);}
.cp{font-size:16px;font-weight:700;color:var(--p);}.cn{font-size:11px;color:var(--tx);font-weight:500;margin-top:1px;line-height:1.4;}
.ob{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;margin-left:5px;display:inline-block;}
.ob-r{background:#FDECEA;color:var(--rd);}.ob-y{background:#FFF3E0;color:var(--yw);}
.ob-g{background:#E6F9F5;color:var(--gn);}.ob-p{background:#EDE9FA;color:var(--p);}
.qt{background:var(--lt);border-left:3px solid var(--p);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:#555;font-style:italic;margin:6px 0;line-height:1.6;}
.qt.red{border-left-color:var(--rd);background:#FFF5F5;}
.opp-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;}
.opp-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:16px;}
.opp-title{font-size:14px;font-weight:700;color:var(--tx);}
.opp-sub{font-size:12px;color:var(--mu);margin-top:3px;}
.opp-badges{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.opp-body{font-size:13px;color:#555;line-height:1.6;margin-bottom:12px;}
.opp-metric{background:var(--bg);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--mu);line-height:1.7;}
.opp-metric strong{color:var(--p);}
.rec-stat{background:#FFF0F0;border:1px solid #FFCCCC;border-radius:12px;padding:22px 24px;}
.rec-big{font-size:48px;font-weight:800;color:var(--rd);line-height:1;}
.rec-label{font-size:12px;color:var(--mu);margin-top:5px;}
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--bd);}
.tl-item{position:relative;padding:0 0 20px 20px;}
.tl-item::before{content:'';position:absolute;left:-15px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--rd);}
.tl-title{font-size:13px;font-weight:700;color:var(--tx);}
.tl-body{font-size:12px;color:var(--mu);margin-top:4px;line-height:1.6;}
.itb{width:100%;border-collapse:collapse;font-size:12px;}
.itb th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--bd);color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
.itb td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;}
.itb tr:last-child td{border-bottom:none;}.itb tr:hover td{background:#fafafa;}
.tv{font-weight:700;color:var(--p);}
.fil{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fil select,.fil input{padding:7px 10px;border-radius:8px;border:1px solid var(--bd);font-size:12px;background:#fff;color:var(--tx);}
.ci-info{font-size:11px;color:var(--mu);margin-bottom:8px;}
.nd{text-align:center;padding:40px;color:var(--mu);font-size:13px;}
.oi{padding:12px 0;border-bottom:1px solid var(--bd);}.oi:last-child{border-bottom:none;}
.ot{font-size:13px;font-weight:600;margin-bottom:4px;}
.os{display:flex;gap:10px;font-size:11px;color:var(--mu);flex-wrap:wrap;}.os strong{color:var(--tx);}
.section-title{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.info-note{background:#EDE9FA;border:1px solid #C0A0E0;border-radius:8px;padding:10px 14px;font-size:12px;color:#555;margin-bottom:14px;}
.updated-badge{background:rgba(0,184,154,.15);color:var(--gn);font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;margin-left:8px;}
footer{text-align:center;padding:16px;color:var(--mu);font-size:11px;border-top:1px solid var(--bd);margin-top:20px;}
@media(max-width:900px){.kr,.g2,.mk4{grid-template-columns:repeat(2,1fr);}.cg{grid-template-columns:1fr;}header,.subnav,.innav,.pg{padding-left:16px;padding-right:16px;}}
</style>
</head>
